name: Bug report
description: Bug or regression
labels: [bug]
body:
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps and environment
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Redacted logs/screenshots
