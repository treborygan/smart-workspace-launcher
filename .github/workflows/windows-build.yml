name: Windows Build (unverified preview)

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Build portable ZIP and NSIS installer (x64)
    runs-on: windows-2025
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Set up Rust (MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Run mandatory verification
        run: .\scripts\verify.ps1
      - name: Compile and package Windows binary
        run: |
          .\scripts\build-windows.ps1 -SkipVerification -Version "0.1.0-preview.${{ github.run_number }}"
      - name: Verify package structure and checksum
        run: |
          $archives = @(Get-ChildItem releases/local/*-win-x64-portable.zip -ErrorAction Stop)
          if ($archives.Count -ne 1) { throw "Expected one portable ZIP; found $($archives.Count)" }
          foreach ($archive in $archives) {
            $shaPath = "$($archive.FullName).sha256"
            if (-not (Test-Path $shaPath)) { throw "Missing checksum: $shaPath" }
            $digest = (Get-FileHash -Algorithm SHA256 $archive.FullName).Hash.ToLowerInvariant()
            $recorded = (Get-Content $shaPath -Raw).Trim().Split(' ')[0].ToLowerInvariant()
            if ($digest -ne $recorded) { throw "SHA256 mismatch: $($archive.Name)" }
            $entries = @(tar -tf $archive.FullName)
            if ($LASTEXITCODE -ne 0) { throw "Unable to inspect ZIP: $($archive.Name)" }
            if (-not (@($entries | Where-Object { $_ -like '*.exe' }).Count)) { throw 'ZIP lacks a Windows executable' }
            Write-Host "VALIDATED archive=$($archive.Name), sha256=$digest"
          }
          $manifest = [ordered]@{
            version = '0.1.0-preview.${{ github.run_number }}'
            commit = '${{ github.sha }}'
            hosted_runner = 'windows-2025'
            qualification = 'BUILD_ARTIFACT_ONLY'
            windows_11_acceptance = 'NOT_RUN'
            v1_release_ready = $false
            sha256 = $digest
          }
          $manifest | ConvertTo-Json | Set-Content releases/local/build-provenance.json -Encoding UTF8
      - name: Report preview build
        if: always()
        run: |
          "## Windows build preview" | Add-Content -Path $env:GITHUB_STEP_SUMMARY
          "Outputs here are unsigned **test artifacts**, not a V1 release." | Add-Content -Path $env:GITHUB_STEP_SUMMARY
          "Real Windows 11 W-001..W-014 acceptance is still required." | Add-Content -Path $env:GITHUB_STEP_SUMMARY
      - name: Upload Windows ZIP, checksum and provenance
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: smart-workspace-win-x64-preview-${{ github.run_id }}
          path: |
            releases/local/*.zip
            releases/local/*.sha256
            releases/local/build-provenance.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload NSIS installer if present
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: smart-workspace-win-x64-installer-${{ github.run_id }}
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn
          retention-days: 14
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/verification/
          if-no-files-found: warn
          retention-days: 14
