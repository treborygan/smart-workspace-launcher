[package]
name = "smart-workspace-launcher"
version = "0.1.0"
description = "Local-first Windows workspace launcher"
authors = ["Smart Workspace Launcher contributors"]
edition = "2021"

[lib]
name = "smart_workspace_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
cap-fs-ext = "=4.0.3"
cap-std = "=4.0.3"
libc = "0.2"
rusqlite = { version = "0.32", features = ["bundled", "chrono"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2.3"
tokio = { version = "1", features = ["time"] }
thiserror = "2"
url = "2"
uuid = { version = "1", features = ["serde", "v4"] }
sha2 = "0.10"
zip = { version = "2.4", default-features = false, features = ["deflate"] }
wasmi = "2.0.0"
wasmparser = "=0.228.0"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
wat = "1.262.0"
